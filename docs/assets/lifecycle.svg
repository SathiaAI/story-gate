<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="Story lifecycle: defined specs, READY gate, build with checkpoints, DONE gate, independent CI check, human merge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#fafafa}.panel{fill:#ffffff;stroke:#e4e4e7;stroke-width:1.2}
  .ink{fill:#18181b}.muted{fill:#52525b}.faint{fill:#a1a1aa}
  .accent{fill:#047857}.accentS{stroke:#047857}.accentBg{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}
  .warnBg{fill:#fffbeb;stroke:#b45309;stroke-width:1.2}.warn{fill:#b45309}
  .stopBg{fill:#fff1f2;stroke:#be123c;stroke-width:1.2}.stop{fill:#be123c}
  .line{stroke:#71717a;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
  .chip{fill:#f4f4f5;stroke:#d4d4d8}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-size:15px;font-weight:650}.t{font-size:12.5px}.s{font-size:11px}.k{font-size:10.5px;letter-spacing:.08em;font-weight:650}
  @media (prefers-color-scheme: dark){
    .bg{fill:#09090b}.panel{fill:#18181b;stroke:#3f3f46}
    .ink{fill:#f4f4f5}.muted{fill:#a1a1aa}.faint{fill:#71717a}
    .accent{fill:#34d399}.accentS{stroke:#34d399}.accentBg{fill:#052e22;stroke:#34d399}
    .warnBg{fill:#2a1a05;stroke:#f59e0b}.warn{fill:#fbbf24}
    .stopBg{fill:#2a0a12;stroke:#fb7185}.stop{fill:#fb7185}
    .line{stroke:#a1a1aa}.chip{fill:#27272a;stroke:#3f3f46}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect class="bg" width="1040" height="470" rx="18"/>
<text x="32" y="40" class="k accent">STORY LIFECYCLE</text>
<text x="32" y="64" class="h ink">Starts on defined specs. Built and tested against them. Ends on them.</text>

<!-- specs -->
<rect class="panel" x="32" y="96" width="150" height="196" rx="14"/>
<text x="48" y="122" class="k muted">DEFINED SPECS</text>
<rect class="chip" x="48" y="136" width="118" height="30" rx="8"/><text x="60" y="156" class="t ink">PRD</text>
<rect class="chip" x="48" y="174" width="118" height="30" rx="8"/><text x="60" y="194" class="t ink">TRD</text>
<rect class="chip" x="48" y="212" width="118" height="30" rx="8"/><text x="60" y="232" class="t ink">Story + ACs</text>
<text x="48" y="270" class="s muted">Linear · repo · control-hub</text>
<text x="48" y="284" class="s muted">or your own channel</text>

<path class="line" d="M182 194 H214" marker-end="url(#a)"/>

<!-- READY -->
<rect class="accentBg" x="218" y="96" width="186" height="196" rx="14"/>
<text x="234" y="122" class="k accent">1 · READY</text>
<text x="234" y="146" class="t ink">Story complete?</text>
<text x="234" y="168" class="t ink">Drift vs PRD / TRD?</text>
<text x="234" y="190" class="t ink">Tests per AC: + / − /</text>
<text x="234" y="206" class="t ink">edge / regression</text>
<text x="234" y="228" class="t ink">Upstream handoffs?</text>
<text x="234" y="250" class="t ink">Past learnings read?</text>
<text x="234" y="278" class="s muted mono">gate.py score ID ready</text>

<path class="line" d="M404 194 H436" marker-end="url(#a)"/>

<!-- BUILD -->
<rect class="panel" x="440" y="96" width="250" height="196" rx="14"/>
<text x="456" y="122" class="k muted">2 · BUILD + CHECKPOINTS</text>
<line class="line" x1="466" y1="170" x2="664" y2="170"/>
<circle cx="500" cy="170" r="9" class="accentBg"/><circle cx="565" cy="170" r="9" class="accentBg"/><circle cx="630" cy="170" r="9" class="warnBg"/>
<text x="490" y="150" class="s muted">22%</text><text x="555" y="150" class="s muted">58%</text><text x="618" y="150" class="s warn">81%</text>
<text x="456" y="204" class="t ink">Every 10 code edits, Jev asks:</text>
<text x="456" y="224" class="t muted">on course? · ~% done per AC ·</text>
<text x="456" y="242" class="t muted">drift? · scope creep? · TODOs? ·</text>
<text x="456" y="260" class="t muted">tests keeping pace?</text>
<text x="456" y="282" class="s muted mono">gate.py checkpoint ID</text>

<path class="line" d="M690 194 H722" marker-end="url(#a)"/>

<!-- DONE -->
<rect class="accentBg" x="726" y="96" width="176" height="196" rx="14"/>
<text x="742" y="122" class="k accent">3 · DONE</text>
<text x="742" y="146" class="t ink">Code matches spec?</text>
<text x="742" y="168" class="t ink">Each AC traced to</text>
<text x="742" y="184" class="t ink">real tests, all green</text>
<text x="742" y="206" class="t ink">on this exact code?</text>
<text x="742" y="228" class="t ink">Handoff written?</text>
<text x="742" y="250" class="t ink">Learnings logged?</text>
<text x="742" y="278" class="s muted mono">gate.py score ID done</text>

<path class="line" d="M902 194 H934" marker-end="url(#a)"/>

<!-- CI + merge -->
<rect class="panel" x="938" y="96" width="74" height="92" rx="14"/>
<text x="975" y="130" text-anchor="middle" class="k muted">4 · CI</text>
<text x="975" y="152" text-anchor="middle" class="s ink">re-scores</text>
<text x="975" y="166" class="s ink" text-anchor="middle">on its own</text>
<path class="line" d="M975 188 V214" marker-end="url(#a)"/>
<rect class="panel" x="938" y="218" width="74" height="74" rx="14"/>
<text x="975" y="250" text-anchor="middle" class="k ink">MERGE</text>
<text x="975" y="270" text-anchor="middle" class="s muted">by a human</text>

<!-- drift lane -->
<rect class="warnBg" x="218" y="330" width="684" height="56" rx="12"/>
<text x="234" y="354" class="k warn">DRIFT, AT ANY POINT</text>
<text x="234" y="374" class="t ink">Story ≠ spec → escalate to architect and the owning session → a human decides → fix the source → re-score</text>
<path class="line dash" d="M311 292 V330"/><path class="line dash" d="M565 292 V330"/><path class="line dash" d="M814 292 V330"/>

<!-- off course -->
<rect class="stopBg" x="440" y="400" width="250" height="44" rx="12"/>
<text x="456" y="427" class="t stop">OFF COURSE → fix it or escalate</text>
<rect class="panel" x="726" y="400" width="286" height="44" rx="12"/>
<text x="742" y="427" class="t muted">Every event → control-hub · Linear · webhook</text>
</svg>
