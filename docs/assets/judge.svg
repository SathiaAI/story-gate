<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="Who decides: cheap agents gather evidence, Jev scores it, gate.py rules produce the verdict" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#fafafa}.panel{fill:#ffffff;stroke:#e4e4e7;stroke-width:1.2}
  .ink{fill:#18181b}.muted{fill:#52525b}.faint{fill:#a1a1aa}
  .accent{fill:#047857}.accentS{stroke:#047857}.accentBg{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}
  .warnBg{fill:#fffbeb;stroke:#b45309;stroke-width:1.2}.warn{fill:#b45309}
  .stopBg{fill:#fff1f2;stroke:#be123c;stroke-width:1.2}.stop{fill:#be123c}
  .line{stroke:#71717a;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
  .chip{fill:#f4f4f5;stroke:#d4d4d8}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-size:15px;font-weight:650}.t{font-size:12.5px}.s{font-size:11px}.k{font-size:10.5px;letter-spacing:.08em;font-weight:650}
  @media (prefers-color-scheme: dark){
    .bg{fill:#09090b}.panel{fill:#18181b;stroke:#3f3f46}
    .ink{fill:#f4f4f5}.muted{fill:#a1a1aa}.faint{fill:#71717a}
    .accent{fill:#34d399}.accentS{stroke:#34d399}.accentBg{fill:#052e22;stroke:#34d399}
    .warnBg{fill:#2a1a05;stroke:#f59e0b}.warn{fill:#fbbf24}
    .stopBg{fill:#2a0a12;stroke:#fb7185}.stop{fill:#fb7185}
    .line{stroke:#a1a1aa}.chip{fill:#27272a;stroke:#3f3f46}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect class="bg" width="1040" height="300" rx="18"/>
<text x="32" y="40" class="k accent">WHO DECIDES</text>
<text x="32" y="64" class="h ink">Agents collect evidence. Jev scores it. Fixed rules make the call.</text>

<rect class="panel" x="32" y="92" width="212" height="170" rx="14"/>
<text x="48" y="118" class="k muted">CHEAP AGENTS</text>
<text x="48" y="142" class="t ink">small tier: fetch, copy, log</text>
<text x="48" y="162" class="t ink">medium tier: read specs,</text>
<text x="48" y="178" class="t ink">write test plan + handoff</text>
<text x="48" y="204" class="s muted">Never frontier models.</text>
<text x="48" y="220" class="s muted">Same tiers in every client.</text>
<text x="48" y="246" class="s faint">They never score, waive or decide.</text>

<path class="line" d="M244 177 H276" marker-end="url(#a)"/>
<rect class="panel" x="280" y="92" width="212" height="170" rx="14"/>
<text x="296" y="118" class="k muted">EVIDENCE FILES</text>
<text x="296" y="142" class="t ink mono">story.md · context.md</text>
<text x="296" y="162" class="t ink mono">tests.json · trace.md</text>
<text x="296" y="182" class="t ink mono">test_results.json</text>
<text x="296" y="202" class="t ink mono">handoff.md · learnings</text>
<text x="296" y="230" class="s muted">+ the code diff vs base</text>
<text x="296" y="246" class="s muted">Hash-locked: edits invalidate</text>

<path class="line" d="M492 177 H524" marker-end="url(#a)"/>
<rect class="accentBg" x="528" y="92" width="212" height="170" rx="14"/>
<text x="544" y="118" class="k accent">JEV (THE JUDGE)</text>
<text x="544" y="142" class="t ink">Yes/no probability per check</text>
<text x="544" y="162" class="t ink">+ drift direction</text>
<text x="544" y="190" class="s muted">~0.3 s · well under $0.001</text>
<text x="544" y="206" class="s muted">Same judge in every client</text>
<text x="544" y="234" class="s faint">No key? Agent self-scores,</text>
<text x="544" y="248" class="s faint">capped below PASS.</text>

<path class="line" d="M740 177 H772" marker-end="url(#a)"/>
<rect class="panel" x="776" y="92" width="232" height="170" rx="14"/>
<text x="792" y="118" class="k muted">GATE.PY VERDICT</text>
<rect class="accentBg" x="792" y="132" width="62" height="24" rx="6"/><text x="823" y="149" text-anchor="middle" class="s accent">PASS</text>
<rect class="warnBg" x="860" y="132" width="78" height="24" rx="6"/><text x="899" y="149" text-anchor="middle" class="s warn">CONCERNS</text>
<rect class="stopBg" x="944" y="132" width="52" height="24" rx="6"/><text x="970" y="149" text-anchor="middle" class="s stop">FAIL</text>
<rect class="warnBg" x="792" y="162" width="86" height="24" rx="6"/><text x="835" y="179" text-anchor="middle" class="s warn">ESCALATED</text>
<rect class="chip" x="884" y="162" width="72" height="24" rx="6"/><text x="920" y="179" text-anchor="middle" class="s muted">WAIVED</text>
<text x="792" y="214" class="s muted">≥ 0.7 pass · ≥ 0.4 concerns · else fail</text>
<text x="792" y="232" class="s muted">Structural facts can't be waived.</text>
<text x="792" y="248" class="s muted">Only a human waives or decides.</text>
</svg>
