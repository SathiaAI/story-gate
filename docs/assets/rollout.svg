<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" role="img" aria-label="Rollout ladder from warn mode to full enforce" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#fafafa}.panel{fill:#ffffff;stroke:#e4e4e7;stroke-width:1.2}
  .ink{fill:#18181b}.muted{fill:#52525b}.faint{fill:#a1a1aa}
  .accent{fill:#047857}.accentS{stroke:#047857}.accentBg{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}
  .warnBg{fill:#fffbeb;stroke:#b45309;stroke-width:1.2}.warn{fill:#b45309}
  .stopBg{fill:#fff1f2;stroke:#be123c;stroke-width:1.2}.stop{fill:#be123c}
  .line{stroke:#71717a;stroke-width:1.6;fill:none}.dash{stroke-dasharray:5 5}
  .chip{fill:#f4f4f5;stroke:#d4d4d8}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .h{font-size:15px;font-weight:650}.t{font-size:12.5px}.s{font-size:11px}.k{font-size:10.5px;letter-spacing:.08em;font-weight:650}
  @media (prefers-color-scheme: dark){
    .bg{fill:#09090b}.panel{fill:#18181b;stroke:#3f3f46}
    .ink{fill:#f4f4f5}.muted{fill:#a1a1aa}.faint{fill:#71717a}
    .accent{fill:#34d399}.accentS{stroke:#34d399}.accentBg{fill:#052e22;stroke:#34d399}
    .warnBg{fill:#2a1a05;stroke:#f59e0b}.warn{fill:#fbbf24}
    .stopBg{fill:#2a0a12;stroke:#fb7185}.stop{fill:#fb7185}
    .line{stroke:#a1a1aa}.chip{fill:#27272a;stroke:#3f3f46}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs>
<rect class="bg" width="1040" height="250" rx="18"/>
<text x="32" y="40" class="k accent">ROLLOUT LADDER</text>
<text x="32" y="64" class="h ink">Start in warn mode. Turn on blocking one point at a time.</text>
<g>
<rect class="warnBg" x="32" y="92" width="184" height="124" rx="14"/>
<text x="48" y="118" class="k warn">STEP 0 · WARN</text><text x="48" y="142" class="t ink">Everything reports,</text><text x="48" y="158" class="t ink">nothing blocks.</text><text x="48" y="196" class="s muted mono">"mode": "warn"</text>
<path class="line" d="M216 154 H236" marker-end="url(#a)"/>
<rect class="panel" x="240" y="92" width="184" height="124" rx="14"/>
<text x="256" y="118" class="k muted">STEP 1 · CI</text><text x="256" y="142" class="t ink">PRs can't merge</text><text x="256" y="158" class="t ink">without passing gates.</text><text x="256" y="196" class="s muted mono">"enforce_points":["ci"]</text>
<path class="line" d="M424 154 H444" marker-end="url(#a)"/>
<rect class="panel" x="448" y="92" width="184" height="124" rx="14"/>
<text x="464" y="118" class="k muted">STEP 2 · PRE-EDIT</text><text x="464" y="142" class="t ink">No code edits until</text><text x="464" y="158" class="t ink">READY passes.</text><text x="464" y="196" class="s muted mono">+ "pre_edit"</text>
<path class="line" d="M632 154 H652" marker-end="url(#a)"/>
<rect class="panel" x="656" y="92" width="184" height="124" rx="14"/>
<text x="672" y="118" class="k muted">STEP 3 · CHECKPOINT</text><text x="672" y="142" class="t ink">OFF COURSE freezes</text><text x="672" y="158" class="t ink">edits until fixed.</text><text x="672" y="196" class="s muted mono">+ "checkpoint", "stop"</text>
<path class="line" d="M840 154 H860" marker-end="url(#a)"/>
<rect class="stopBg" x="864" y="92" width="148" height="124" rx="14"/>
<text x="880" y="118" class="k stop">FULL ENFORCE</text><text x="880" y="142" class="t ink">Every point</text><text x="880" y="158" class="t ink">blocks.</text><text x="880" y="196" class="s muted mono">"mode": "enforce"</text>
</g>
</svg>
