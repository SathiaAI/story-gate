name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest], python: ["3.9", "3.12"] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest tests/test_gate.py -v
  isolation:
    # Pull request code runs as a separate throwaway account in CI (sg_isolate.py). This runs hostile tests, scenarios
    # and budgets on a real GitHub runner, as its own user with password-free sudo, and checks every attack failed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/isolation_e2e.py
